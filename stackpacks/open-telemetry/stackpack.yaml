name: "open-telemetry"
version: "0.1.6"
schemaVersion: "2.0"
displayName: "Open Telemetry"
categories: [ "Open Telemetry" ]
logoUrl: !resource "logo.png"
# information that will go in the overview section
overviewUrl: !resource "overview.md"
# information that will go to the detailed-overview section
detailedOverviewUrl: !resource "detailed-overview.md"
# information that will go in the configuration section
configurationUrls:
  NOT_INSTALLED: !resource "configuration.md"
  PROVISIONING: !resource "provisioning.md"
  WAITING_FOR_DATA: !resource "waitingfordata.md"
  INSTALLED: !resource "enabled.md"
  DEPROVISIONING: !resource "configuration.md"
  ERROR: !resource "configuration.md"
provision:
  companionStackPacks: []
ingestion:
  global:
    instructions: !resource "ingestion-global.md"
    dataTypes:
      topology: 'label = "stackpack:open-telemetry"'
      metrics: 'otel_span_calls_total'
      traces: {}
  cluster:
    display: "OpenTelemetry"
    description: "Receive OTLP traces, metrics and logs from applications in the cluster through the telemetry gateway."
    values: !resource "ingestion-cluster-values.yaml"
    dataTypes:
      topology: 'label = "stackpack:open-telemetry"'
      metrics: 'otel_span_calls_total'
      traces: {}
