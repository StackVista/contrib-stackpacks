name: "otel-k8s-crd"
version: "0.0.14"
schemaVersion: "2.0"
displayName: "Kubernetes Custom Resources"
categories: [ "Kubernetes" ]
logoUrl: !resource "logo.svg"
overviewUrl: !resource "overview.md"
detailedOverviewUrl: !resource "detailed-overview.md"
configurationUrls:
  NOT_INSTALLED: !resource "configuration.md"
  PROVISIONING: !resource "provisioning.md"
  WAITING_FOR_DATA: !resource "waitingfordata.md"
  INSTALLED: !resource "enabled.md"
  DEPROVISIONING: !resource "configuration.md"
  ERROR: !resource "error.md"
provision:
  companionStackPacks: []
ingestion:
  cluster:
    display: "OpenTelemetry Kubernetes CRDs"
    description: "Custom resource definitions collected by the agent's resource collector."
    values: !resource "ingestion-cluster-values.yaml"
    options:
      - name: kubewarden
        display: "Kubewarden policies"
        default: true
        values: !resource "ingestion-option-kubewarden.yaml"
      - name: kubevirt
        display: "KubeVirt virtual machines"
        values: !resource "ingestion-option-kubevirt.yaml"
      - name: gateway-api
        display: "Gateway API"
        values: !resource "ingestion-option-gateway-api.yaml"
      - name: helm-controller
        display: "Helm controller charts (helm.cattle.io)"
        values: !resource "ingestion-option-helm-controller.yaml"
